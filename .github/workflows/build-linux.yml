name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built on Debian bookworm so the tools run on Debian 12, Ubuntu 22.04
      # and newer with the distribution's own libraries.
      - name: Build, test, install and package
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential cmake git python3 pandoc file \
                libmosquitto-dev libexpat1-dev libssl-dev libcurl4-openssl-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
              cmake --build build --parallel "$(nproc)"
              ctest --test-dir build --output-on-failure
              DESTDIR=/src/staging cmake --install build
              tar -C /src/staging -czf /src/vscp-cli-linux-x86_64.tar.gz .
              (cd build && cpack -G DEB)
              cp build/vscp-cli_*.deb /src/
            '

      - name: Write SHA256SUMS
        id: sha256sums
        continue-on-error: true
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscp-cli-linux-x86_64" <<'SHA256SUMS_PATTERNS'
          vscp-cli-linux-x86_64.tar.gz
          vscp-cli_*.deb
          SHA256SUMS_PATTERNS

      - uses: actions/upload-artifact@v4
        with:
          name: vscp-cli-linux-x86_64
          path: |
            vscp-cli-linux-x86_64.tar.gz
            vscp-cli_*.deb
            ${{ steps.sha256sums.outputs.file }}
          if-no-files-found: error
